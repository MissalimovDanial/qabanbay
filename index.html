<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2832">
  <title>Кабанбай — Путь батыра</title>
  <meta name="description" content="Кабанбай — Путь батыра. Пять испытаний и карта путешествия.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c2832; }
    body { color: #fff1cc; font: 16px/1.55 system-ui, sans-serif; }
    #canvas { display: block; outline: none; touch-action: none; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 75%, #2b5050, #0c2832 73%);
    }
    .ridge { position: absolute; inset: auto 0 0; height: 42%; background: #133743;
      clip-path: polygon(0 37%, 12% 18%, 28% 44%, 48% 10%, 67% 41%, 88% 16%, 100% 36%, 100% 100%, 0 100%); }
    .card { position: relative; width: min(670px, 100%); max-height: 100%; padding: clamp(20px, 6vh, 50px) clamp(17px, 5vw, 52px);
      text-align: center; border: 1px solid #d7b374; box-shadow: 0 0 0 5px #0b232caa, 0 18px 50px #06151b88;
      background: #0e2c36f2; }
    .seal { color: #e9c179; font-size: 1.05rem; letter-spacing: .7em; }
    h1 { font: 700 clamp(34px, 7vw, 68px)/1.1 Georgia, serif; margin: .32em 0 .1em; }
    .subtitle { color: #d3b57f; letter-spacing: .19em; text-transform: uppercase; margin: 0 0 clamp(12px, 5vh, 30px); }
    progress { width: 100%; height: 12px; accent-color: #72c8c3; }
    #progress-text { margin: .3em 0 0; color: #9fd1ca; }
    .tip { min-height: 3.2em; color: #e1e8d9; margin: clamp(12px, 5vh, 34px) 0 0; }
    #failure { color: #ffcbad; margin-top: 1em; }
    button { font: inherit; color: #fff1cc; background: #25606a; padding: .4em 1.2em; border: 1px solid #d7b374; }
    [hidden] { display: none !important; }
    @media (orientation: landscape) and (max-height: 450px) {
      .card { padding-block: 12px; } .tip { min-height: 1.6em; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Игра Кабанбай">Этот браузер не поддерживает игровой экран.</canvas>
  <main id="loading">
    <div class="ridge" aria-hidden="true"></div>
    <section class="card" aria-label="Загрузка игры">
      <div class="seal" aria-hidden="true">◆ ❖ ◆</div>
      <h1>Қабанбай</h1>
      <p class="subtitle">Путь батыра</p>
      <progress id="progress" aria-label="Загрузка игры"></progress>
      <p id="progress-text">Готовим путь…</p>
      <p id="tip" class="tip">У края трещины нажми прыжок и держи направление.</p>
      <div id="failure" hidden>
        <p id="reason"></p>
        <button id="retry" type="button">Повторить загрузку</button>
      </div>
      <noscript>Для игры нужен JavaScript.</noscript>
    </section>
  </main>
  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":104930760,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    const overlay = document.getElementById("loading");
    const progress = document.getElementById("progress");
    const progressText = document.getElementById("progress-text");
    const tip = document.getElementById("tip");
    const tips = [
      "У края трещины нажми прыжок и держи направление.",
      "Во время бега синие молнии расходуются. На шаге они возвращаются.",
      "Асыки можно найти на тропе и на каменных уступах.",
      "Одиннадцать обычных попаданий заряжают суперудар."
    ];
    let tipIndex = 0;
    const rotation = setInterval(() => {
      tipIndex = (tipIndex + 1) % tips.length;
      tip.textContent = tips[tipIndex];
    }, 4200);

    document.getElementById("retry").addEventListener("click", () => location.reload());
    function showError(message) {
      clearInterval(rotation);
      progress.hidden = true;
      progressText.hidden = true;
      tip.hidden = true;
      document.getElementById("reason").textContent = message;
      document.getElementById("failure").hidden = false;
    }

    if (typeof Engine === "undefined") {
      showError("Не удалось загрузить игру. Проверь соединение и попробуй ещё раз.");
    } else if (Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED}).length) {
      showError("Открой игру в браузере с поддержкой WebGL 2.");
    } else {
      new Engine(GODOT_CONFIG).startGame({onProgress(current, total) {
        if (total > 0) {
          progress.max = total;
          progress.value = current;
          progressText.textContent = current < total
            ? "Загрузка игры · " + Math.min(100, Math.floor(current / total * 100)) + "%"
            : "Открываем карту…";
        }
      }}).then(() => {
        clearInterval(rotation);
        overlay.remove();
      }).catch((error) => {
        console.error(error);
        showError("Игра не запустилась. Обнови страницу и попробуй снова.");
      });
    }
  </script>
</body>
</html>
