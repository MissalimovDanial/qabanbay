name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-build
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Verify the browser export
        run: |
          test -s index.html
          if [ ! -f index.pck ]; then
            cat index.pck.part-* > index.pck
            sha256sum --check index.pck.sha256
            rm index.pck.part-* index.pck.sha256
          fi
          test -s index.pck
          test -s index.wasm
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

